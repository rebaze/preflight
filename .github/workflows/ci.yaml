name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '45 5 * * 1'

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/security/go.sum
      - name: Verify scanner dependencies and scan
        run: |
          go -C tools/security mod tidy -diff
          go -C tools/security mod verify
          go -C tools/security tool govulncheck -C ../.. -format text ./...
          go -C tools/security tool govulncheck -format text golang.org/x/vuln/cmd/govulncheck

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-conftest
      - name: Check formatting and module metadata
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal integration)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go mod tidy -diff
      - run: go test -race ./...
      - run: go vet ./...
      - run: conftest verify --policy policy
      - name: Build and smoke test
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o bin/preflight ./cmd/preflight
          bin/preflight version
          bin/preflight --help

  packaging:
    name: Release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true
      - name: Test publication and Homebrew helpers offline
        run: |
          python3 -m unittest discover -s tools -p '*_test.py'
          shellcheck .github/actions/setup-conftest/install.sh
      - run: goreleaser check
      - name: Build all snapshot archives without publishing
        run: goreleaser release --snapshot --clean --skip=publish,sign,announce
      - name: Inspect archives and run native packaged CLI
        run: python3 tools/check-packages.py dist
