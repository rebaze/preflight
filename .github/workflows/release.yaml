name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize this repository's release workflow. Other writers must respect
# the documented single-writer policy; concurrency is not an access control.
concurrency:
  group: preflight-release-publication
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os,re; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", os.environ["TAG"]), "invalid release tag"'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build release assets locally (no publication)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect packaged assets
        run: python3 tools/check-packages.py dist

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          # Exclude GoReleaser's dist/ so the "source" SBOM reflects the
          # repository, not the build outputs produced in the previous step.
          syft dir:. \
            --exclude './dist/**' \
            --output "cyclonedx-json=dist/preflight-${GITHUB_REF_NAME}-source.cdx.json"

      - name: Stage the exact release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release-publish.py stage \
            --dist dist --stage release-assets --inventory release-inventory.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Attest build provenance for release archives
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt

      - name: Attest source SBOM (CycloneDX) against all archives
        id: attest-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
          sbom-path: release-assets/preflight-${{ github.ref_name }}-source.cdx.json

      - name: Verify draft, publish and verify immutable result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for bundle in "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE"; do
            if [[ ! -s "$bundle" ]]; then
              echo "attestation bundle missing or empty: ${bundle:-<unset>}" >&2
              exit 1
            fi
          done
          # Keep the assembled bundle outside the frozen staging directory.
          # awk terminates each record even when an input lacks a final newline.
          awk 1 "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" > release-attestations.jsonl
          python3 tools/release-publish.py publish \
            --stage release-assets --inventory release-inventory.json \
            --bundle release-attestations.jsonl --tag "$TAG" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Retain verified assets for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: release-assets/
          retention-days: 7

      - name: Homebrew setup status
        if: ${{ !contains(github.ref_name, '-') && vars.PUBLISH_HOMEBREW != 'true' }}
        run: echo 'Homebrew publication is disabled. See docs/releases.md for App setup and manual retry.' >> "$GITHUB_STEP_SUMMARY"

  publish-tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') && vars.PUBLISH_HOMEBREW == 'true' }}
    uses: ./.github/workflows/publish-homebrew.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
