name: Verify Release App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mint tap-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: rebaze
          repositories: homebrew-tap
          permission-contents: write
      - name: Verify installation scope without writing to the tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Minting above explicitly requests contents:write. GitHub rejects
          # permissions not granted to the installation. Repository user-role
          # booleans such as permissions.push do not describe this token grant.
          gh api --paginate --slurp installation/repositories \
            --jq '[.[].repositories[].full_name] == ["rebaze/homebrew-tap"]' | grep -qx true
          gh api repos/rebaze/homebrew-tap/contents --jq 'length'
          echo 'Tap-only installation scope and readable contents verified; contents:write was requested at minting.'
