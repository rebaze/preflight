version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools/security"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
      attestations:
        patterns: ["actions/attest*"]
